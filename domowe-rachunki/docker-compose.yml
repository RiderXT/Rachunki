services:
  web:
    build: .
    image: domowe-rachunki:latest
    ports:
      - "8501:8501"
    environment:
      DB_PATH: /data/rachunki.sqlite
    volumes:
      - ./data:/data
    restart: unless-stopped

  water-sync:
    image: domowe-rachunki:latest
    command: python -m app.water_mail --loop
    env_file: .env
    environment:
      DB_PATH: /data/rachunki.sqlite
      PDF_DIR: /pdf
    volumes:
      - ./data:/data
      # katalog z PDF-ami; ustaw PDF_HOST_DIR na zamontowany udział Synology
      - ${PDF_HOST_DIR:-./pdf}:/pdf
    depends_on:
      - web
    restart: unless-stopped
